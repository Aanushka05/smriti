<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smriti</title>
<meta name="description" content="Smriti — a dementia-support app for patients and their caregivers." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        // Every colour reads from a CSS variable, so the cultural theme in
        // themes.css repaints the whole app without one component changing.
        // The `<alpha-value>` form keeps modifiers like bg-ochre/90 working.
        colors: {
          maroon: 'rgb(var(--c-maroon) / <alpha-value>)',
          maroonDark: 'rgb(var(--c-maroonDark) / <alpha-value>)',
          ochre: 'rgb(var(--c-ochre) / <alpha-value>)',
          ochreSoft: 'rgb(var(--c-ochreSoft) / <alpha-value>)',
          leafgreen: 'rgb(var(--c-leafgreen) / <alpha-value>)',
          slateb: 'rgb(var(--c-slateb) / <alpha-value>)',
          clay: 'rgb(var(--c-clay) / <alpha-value>)',
          alertc: 'rgb(var(--c-alertc) / <alpha-value>)',
          cream: 'rgb(var(--c-cream) / <alpha-value>)',
          panel: 'rgb(var(--c-panel) / <alpha-value>)',
          ink: 'rgb(var(--c-ink) / <alpha-value>)',
          inksoft: 'rgb(var(--c-inksoft) / <alpha-value>)',
          linec: 'rgb(var(--c-linec) / <alpha-value>)',
        },
        fontFamily: { serif2: ['ui-serif', 'Georgia', 'Times New Roman', 'serif'] },
      },
    },
  };
</script>
<!-- Chart.js ships WITH the frontend (frontend/vendor/), loaded from a
     relative path. No CDN, no dependency on which server hosts these files,
     works offline. It is a plain synchronous <script> in <head>, so the
     Chart global is guaranteed to exist before charts.js runs at the end of
     <body> — that is the load-order fix, not a guard around the symptom.
     The CDN below is only a last-resort fallback if the vendored copy is
     missing; chartsReady() reports honestly when neither is available. -->
<script src="vendor/dexie.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script>
  if (typeof Chart === 'undefined') {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"><\/script>');
  }
</script>
<link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes.css">
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6B2737" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Smriti" />
</head>
<body class="textile-bg text-ink min-h-screen">
<div id="app"></div>
<div id="reminder-host"></div>
<div id="chat-host"></div>
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 bg-maroonDark text-white px-5 py-3 rounded-xl shadow-lg text-sm max-w-[90%] text-center z-50"></div>

<!-- Load order matters:
     config.js         defines APP_NAME + API_BASE_URL (the only place a
                       backend URL is configured),
     bhashini-client.js defines t()/i18n,
     app.js            defines state/api/apiFetch/render used by the rest. -->
<script src="config.js"></script>
<script src="bhashini-client.js"></script>
<script src="db.js"></script>
<script src="connectivity.js"></script>
<script src="outbox.js"></script>
<script src="local-store.js"></script>
<script src="app.js"></script>
<script src="realtime.js"></script>
<script src="auth.js"></script>
<script src="adaptive.js"></script>
    <script src="game-session.js"></script>
    <script src="theme.js"></script>
    <script src="speech.js"></script>
    <script src="games.js"></script>
<script src="games-part2.js"></script>
<script src="patient.js"></script>
<script src="reminder-engine.js"></script>
<script src="charts.js"></script>
<script src="daterange.js"></script>
<script src="dashboard.js"></script>
<script src="dashboard-schedule.js"></script>
<script src="dashboard-reports.js"></script>
<script src="dashboard-analysis.js"></script>
<script src="dashboard-play.js"></script>
    <script src="dashboard-offline.js"></script>
<script src="chat.js"></script>
</body>
</html>
